name: build

permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]

env:
  OTP_LATEST: "29"

jobs:
  linux:
    runs-on: ubuntu-latest
    name: OTP ${{ matrix.otp }} ${{ matrix.os }}.${{ matrix.compiler.compiler }}
    #container:
    #  image: erlang:${{matrix.otp}}

    strategy:
      fail-fast: false
      matrix:
        os: [ linux ]
        compiler:
          - { compiler: GNU-14,  CC: gcc-14,   CXX: g++-14 }
          - { compiler: GNU-12,  CC: gcc-12,   CXX: g++-12 }
          - { compiler: LLVM-19, CC: clang-19, CXX: clang++-19 }
        otp:    [27, 28, 29]
        elixir: ['1.20']
        rebar:  ['3.27.0']
        exclude:
          # GCC 14 and clang 19 are only available in OTP 28 (Debian Bookworm+)
          - { otp: 27, compiler: { compiler: GNU-14 } }
          - { otp: 27, compiler: { compiler: LLVM-19 } }
          # GCC 12 is available in OTP 27 (Debian Bookworm)
          - { otp: 28, compiler: { compiler: GNU-12 } }
          - { otp: 29, compiler: { compiler: GNU-12 } }

    env:
      CC:  ${{ matrix.compiler.CC }}
      CXX: ${{ matrix.compiler.CXX }}

    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version:    ${{ matrix.otp }}
          rebar3-version: latest

      - name: OTP Version
        run:  erl -eval '{ok, Version} = file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])), io:format("Version=~s\n", [Version]), halt().' -noshell -noinput;
      - name: Fix Ownership
        run:  git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: Install build tools
        run:  |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl gnupg lsb-release cmake
          # Debian's default repos only ship clang up to ~16; pull newer LLVM
          # releases from the official apt.llvm.org repo when needed.
          if ! apt-cache show ${{ matrix.compiler.CC }} >/dev/null 2>&1; then
            LLVM_VER=$(echo "${{ matrix.compiler.compiler }}" | sed -E 's/^LLVM-//')
            curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
            bash /tmp/llvm.sh "$LLVM_VER"
          fi
          sudo apt-get install -y --no-install-recommends ${{ matrix.compiler.CC }} ${{ matrix.compiler.CXX }}
          # Clang emits LLVM-bitcode objects under LTO; lld is required to link them.
          # Also install clang runtime libraries and llvm-tools for PGO profiling support.
          if echo "${{ matrix.compiler.compiler }}" | grep -q '^LLVM-'; then
            LLVM_VER=$(echo "${{ matrix.compiler.compiler }}" | sed -E 's/^LLVM-//')
            sudo apt-get install -y --no-install-recommends "lld-$LLVM_VER" || sudo apt-get install -y --no-install-recommends lld
            sudo apt-get install -y --no-install-recommends "libclang-rt-$LLVM_VER-dev" || sudo apt-get install -y --no-install-recommends "libclang1-$LLVM_VER"
            # Install llvm tools (may be in llvm package or separate llvm-tools-$VER package)
            sudo apt-get install -y --no-install-recommends "llvm-$LLVM_VER" || sudo apt-get install -y --no-install-recommends "llvm-tools-$LLVM_VER" || sudo apt-get install -y --no-install-recommends llvm-tools || true
          fi
      - name: Build
        run:  make compile
      - name: Cache Dialyzer PLT
        uses: actions/cache@v4
        with:
          path: _build/default/*_plt
          key: dialyzer-plt-${{ matrix.os }}-otp${{ matrix.otp }}-${{ hashFiles('rebar.config', 'rebar.lock') }}
      - name: Check Xref and Dialyzer
        run:  make check
      - name: Sanitize Memory
        run:  make memcheck
      - name: Test
        run:  make test
  macOS:
    name: OTP ${{ matrix.otp }} macos.${{ matrix.compiler.compiler }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { compiler: XCode, CC: cc, CXX: c++ }
        otp:    [27, 28, 29]
        elixir: ['1.20']
    env:
      CC:  ${{ matrix.compiler.CC }}
      CXX: ${{ matrix.compiler.CXX }}
    steps:
      - uses: actions/checkout@v2
      - name: Install Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version:    ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
          rebar3-version: latest
      - name: OTP Version
        run:  erl -eval '{ok, Version} = file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])), io:format("Version=~s\n", [Version]), halt().' -noshell -noinput;
      - name: Fix Ownership
        run:  git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: Install CMake
        run:  brew install cmake
      - name: Build
        run:  make compile
      - name: Cache Dialyzer PLT
        uses: actions/cache@v4
        with:
          path: _build/default/*_plt
          key: dialyzer-plt-macos-otp${{ matrix.otp }}-${{ hashFiles('rebar.config', 'rebar.lock') }}
      - name: Check
        run:  make check
      - name: Test
        run:  make test

  windows:
    name: OTP ${{ matrix.otp }} windows
    # Pinned to windows-2022 (win22 image) — windows-latest now points at a
    # win25-vs2026 image that erlef/setup-beam@v1 doesn't recognize yet.
    # Revert to windows-latest once setup-beam adds win25 support.
    runs-on: windows-2022
    #continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        otp: [27, 28, 29]
        elixir: ["1.20"]
    env:
      CC:  gcc
      CXX: g++

    steps:
      - uses: actions/checkout@v2
      - name: Install Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version:    ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
          rebar3-version: latest
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make
      - name: Debug Erlang discovery
        shell: msys2 {0}
        run: |
          which erl || echo "erl not found"
          erl -noshell -noinput -eval 'io:format("root_dir=~ts~n",[code:root_dir()]),io:format("ei_include=~ts~n",[code:lib_dir(erl_interface,include)]),io:format("ei_lib=~ts~n",[code:lib_dir(erl_interface,lib)]),halt(0).'
      - name: Build
        shell: msys2 {0}
        run:  make compile
      - name: Cache Dialyzer PLT
        uses: actions/cache@v4
        with:
          path: _build/default/*_plt
          key: dialyzer-plt-windows-otp${{ matrix.otp }}-${{ hashFiles('rebar.config', 'rebar.lock') }}
      - name: Check
        shell: msys2 {0}
        run:  make check
      - name: Test
        shell: msys2 {0}
        run:  make test
