name: build

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  OTP_LATEST: "29"

jobs:
  linux:
    runs-on: ubuntu-latest
    name: OTP ${{ matrix.otp }} ${{ matrix.os }}.${{ matrix.compiler.compiler }}

    container:
      image: erlang:${{matrix.otp}}

    strategy:
      fail-fast: false
      matrix:
        os: [ linux ]
        compiler:
          - { compiler: GNU-14,  CC: gcc-14,   CXX: g++-14 }
          - { compiler: GNU-12,  CC: gcc-12,   CXX: g++-12 }
          - { compiler: LLVM-19, CC: clang-19, CXX: clang++-19 }
        otp: [27, 28, 29]
        exclude:
          # GCC 14 and clang 19 are only available in OTP 28 (Debian Bookworm+)
          - { otp: 27, compiler: { compiler: GNU-14 } }
          - { otp: 27, compiler: { compiler: LLVM-19 } }
          # GCC 12 is available in OTP 27 (Debian Bookworm)
          - { otp: 28, compiler: { compiler: GNU-12 } }
          - { otp: 29, compiler: { compiler: GNU-12 } }

    steps:
      - uses: actions/checkout@v2
      - name: OTP Version
        run:  erl -eval '{ok, Version} = file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])), io:format("Version=~s\n", [Version]), halt().' -noshell -noinput;
      - name: Fix Ownership
        run:  git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: Install build tools
        run:  |
          apt-get update -qq
          apt-get install -y --no-install-recommends curl gnupg lsb-release cmake
          # Debian's default repos only ship clang up to ~16; pull newer LLVM
          # releases from the official apt.llvm.org repo when needed.
          if ! apt-cache show ${{ matrix.compiler.CC }} >/dev/null 2>&1; then
            LLVM_VER=$(echo "${{ matrix.compiler.compiler }}" | sed -E 's/^LLVM-//')
            curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
            bash /tmp/llvm.sh "$LLVM_VER"
          fi
          apt-get install -y --no-install-recommends ${{ matrix.compiler.CC }} ${{ matrix.compiler.CXX }}
          # Clang emits LLVM-bitcode objects under LTO; lld is required to link them.
          if echo "${{ matrix.compiler.compiler }}" | grep -q '^LLVM-'; then
            LLVM_VER=$(echo "${{ matrix.compiler.compiler }}" | sed -E 's/^LLVM-//')
            apt-get install -y --no-install-recommends "lld-$LLVM_VER" || apt-get install -y --no-install-recommends lld
          fi
      - name: Build
        env:
          CC:  ${{ matrix.compiler.CC }}
          CXX: ${{ matrix.compiler.CXX }}
        run:  make compile
      - name: Sanitize Memory
        env:
          CC:  ${{ matrix.compiler.CC }}
          CXX: ${{ matrix.compiler.CXX }}
        run: make memcheck
      - name: Test
        env:
          CC:  ${{ matrix.compiler.CC }}
          CXX: ${{ matrix.compiler.CXX }}
        run:  |
          adduser --disabled-password --gecos '' newuser
          chown -R newuser:newuser .
          su -c "make test" newuser

  macOS:
    name: OTP ${{ matrix.otp }} macos.${{ matrix.compiler.compiler }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { compiler: XCode, CC: cc, CXX: c++ }
        otp: [27, 28, 29]
    steps:
      - uses: actions/checkout@v2
      - name: Install Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3'
      - name: OTP Version
        run:  erl -eval '{ok, Version} = file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])), io:format("Version=~s\n", [Version]), halt().' -noshell -noinput;
      - name: Fix Ownership
        run:  git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: Install CMake
        run:  brew install cmake
      - name: Build
        env:
          CC:  ${{ matrix.compiler.CC }}
          CXX: ${{ matrix.compiler.CXX }}
        run:  make compile
      - name: Test
        env:
          CC:  ${{ matrix.compiler.CC }}
          CXX: ${{ matrix.compiler.CXX }}
        run:  make test

  windows:
    name: OTP ${{ matrix.otp }} windows
    # Pinned to windows-2022 (win22 image) — windows-latest now points at a
    # win25-vs2026 image that erlef/setup-beam@v1 doesn't recognize yet.
    # Revert to windows-latest once setup-beam adds win25 support.
    runs-on: windows-2022
    #continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        otp: [27, 28, 29]

    steps:
      - uses: actions/checkout@v2
      - name: Install Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3'
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make
      - name: Debug Erlang discovery
        shell: msys2 {0}
        run: |
          which erl || echo "erl not found"
          erl -noshell -noinput -eval 'io:format("root_dir=~ts~n",[code:root_dir()]),io:format("ei_include=~ts~n",[code:lib_dir(erl_interface,include)]),io:format("ei_lib=~ts~n",[code:lib_dir(erl_interface,lib)]),halt(0).'
      - name: Build
        shell: msys2 {0}
        env:
          CC:  gcc
          CXX: g++
        run:  make compile
      - name: Test
        shell: msys2 {0}
        env:
          CC:  gcc
          CXX: g++
        run:  make test

  detect-release:
    name: Detect Release
    runs-on: ubuntu-latest
    needs: [linux, macOS, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      should_release: ${{ steps.resolve.outputs.should_release }}
      version:        ${{ steps.resolve.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release version
        id: resolve
        run: |
          get_version() { sed -nE 's/.*\{vsn,\s*"([^"]+)".*/\1/p' "$1" | head -1; }

          VERSION=$(get_version src/glazer.app.src)
          PARENT_VERSION=$(git show "HEAD^:src/glazer.app.src" 2>/dev/null | get_version /dev/stdin || echo "")

          if [ "$VERSION" != "$PARENT_VERSION" ]; then
            echo "Version changed: $PARENT_VERSION -> $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Version unchanged — if this commit landed within an hour of the
          # last one, treat it as a follow-up fix to the same release and
          # republish (replacing) the current version on Hex.pm.
          COMMIT_TS=$(git show -s --format=%ct HEAD)
          PARENT_TS=$(git show -s --format=%ct HEAD^)
          AGE=$((COMMIT_TS - PARENT_TS))

          if [ "$AGE" -lt 3600 ]; then
            echo "Version unchanged ($VERSION), but last commit was $((AGE / 60)) minutes ago — republishing"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged ($VERSION), skipping release"
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

  publish-to-hex:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest
    needs: [detect-release]
    if: needs.detect-release.outputs.should_release == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rebar3
        uses: erlef/setup-beam@v1
        with:
          # Latest that excludes pre-releases
          otp-version: "> 0"
          elixir-version: "> 0"
          rebar3-version: '3'
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Check if version is already published
        id: should_publish
        run: |
          VERSION="${{ needs.detect-release.outputs.version }}"
          APP="glazer"
          TODAY=$(date +%Y-%m-%d)

          if mix hex.info "$APP" "$VERSION" 2>/dev/null | grep -q "Released: $TODAY"; then
            echo "publish=replace" >> $GITHUB_OUTPUT
            echo "Version $VERSION published today — will replace"
          elif mix hex.info "$APP" "$VERSION" 2>/dev/null | grep -q "Released:"; then
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION already published on a prior day — skipping"
          else
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION not yet published — will publish"
          fi

      - name: Publish to Hex.pm
        if: steps.should_publish.outputs.publish != 'false'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          VERSION="${{ needs.detect-release.outputs.version }}"
          APP="glazer"
          if [ "${{ steps.should_publish.outputs.publish }}" = "replace" ]; then
            echo "Replacing $APP $VERSION (published today)"
            rebar3 hex publish --repo hexpm --yes --replace
          else
            echo "Publishing $APP $VERSION"
            rebar3 hex publish --repo hexpm --yes
          fi

      - name: Retire prior version
        if: steps.should_publish.outputs.publish != 'false'
        run: |
          set +e
          APP=$(sed -nE '/\{application/{s/.*\{application,\s*([a-z_]+)\s*,.*/\1/p; q}' src/glazer.app.src)

          mix hex.info $APP

          INFO=$(mix hex.info $APP)
          VSNS=$(printf '%s\n' "$INFO" | awk '
            /^Releases:/ { sub(/^Releases:[[:space:]]*/, ""); print; exit }
            /^Recent releases:/ { recent=1; next }
            recent && /^[[:space:]]*[0-9]/ { sub(/^[[:space:]]*/, ""); print; next }
            recent && !/^[[:space:]]/ { exit }
          ')

          if [ -z "$VSNS" ]; then
            echo "$APP: no releases were found on Hex"
            exit 0
          fi

          RELEASES=$(printf '%s\n' "$VSNS" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$')
          echo "Raw release lines:"
          printf '%s\n' "$RELEASES"

          KEEP=$(printf '%s\n' "$RELEASES" | awk 'NR==1 {print $1}')
          TO_RETIRE=$(printf '%s\n' "$RELEASES" | tail -n +2 | grep -v '(retired)' | awk '{print $1}')

          if [ -z "$TO_RETIRE" ]; then
            echo "$APP: no prior versions need to be retired"
            exit 0
          fi

          echo "Keeping latest version: $KEEP"
          echo -n "Versions to retire:\n$TO_RETIRE\n"

          for VSN in $TO_RETIRE; do
            echo "Retiring version $VSN of $APP on Hex..."
            mix hex.retire $APP $VSN deprecated --message "Deprecated"
          done
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
