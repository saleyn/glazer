name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  OTP_LATEST: "29"

jobs:
  linux:
    runs-on: ubuntu-latest
    name: OTP ${{ matrix.otp }} ${{ matrix.os }}.${{ matrix.compiler.compiler }}

    container:
      image: erlang:${{matrix.otp}}

    strategy:
      fail-fast: false
      matrix:
        os: [ linux ]
        compiler:
          - { compiler: GNU-14,  CC: gcc-14,      CXX: g++-14 }
          - { compiler: GNU-12,  CC: gcc-12,      CXX: g++-12 }
          - { compiler: LLVM-19, CC: clang-19,    CXX: clang++-19 }
        otp: [27, 28, 29]
        exclude:
          # GCC 14 and clang 19 are only available in OTP 28 (Debian Bookworm+)
          - { otp: 27, compiler: { compiler: GNU-14 } }
          - { otp: 27, compiler: { compiler: LLVM-19 } }
          # GCC 12 is available in OTP 27 (Debian Bookworm)
          - { otp: 28, compiler: { compiler: GNU-12 } }
          - { otp: 29, compiler: { compiler: GNU-12 } }

    steps:
      - uses: actions/checkout@v2
      - name: OTP Version
        run:  erl -eval '{ok, Version} = file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])), io:format("Version=~s\n", [Version]), halt().' -noshell -noinput;
      - name: Fix Ownership
        run:  git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: Install build tools
        run:  |
          apt-get update -qq
          apt-get install -y --no-install-recommends curl gnupg lsb-release cmake
          # Debian's default repos only ship clang up to ~16; pull newer LLVM
          # releases from the official apt.llvm.org repo when needed.
          if ! apt-cache show ${{ matrix.compiler.CC }} >/dev/null 2>&1; then
            LLVM_VER=$(echo "${{ matrix.compiler.compiler }}" | sed -E 's/^LLVM-//')
            curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
            bash /tmp/llvm.sh "$LLVM_VER"
          fi
          apt-get install -y --no-install-recommends ${{ matrix.compiler.CC }} ${{ matrix.compiler.CXX }}
          # Clang emits LLVM-bitcode objects under LTO; lld is required to link them.
          if echo "${{ matrix.compiler.compiler }}" | grep -q '^LLVM-'; then
            LLVM_VER=$(echo "${{ matrix.compiler.compiler }}" | sed -E 's/^LLVM-//')
            apt-get install -y --no-install-recommends "lld-$LLVM_VER" || apt-get install -y --no-install-recommends lld
          fi
      - name: Build
        env:
          CC:  ${{ matrix.compiler.CC }}
          CXX: ${{ matrix.compiler.CXX }}
        run:  make compile
      - name: Test
        env:
          CC:  ${{ matrix.compiler.CC }}
          CXX: ${{ matrix.compiler.CXX }}
        run:  |
          adduser --disabled-password --gecos '' newuser
          chown -R newuser:newuser .
          su -c "make test" newuser

  macOS:
    name: OTP ${{ matrix.otp }} macos.${{ matrix.compiler.compiler }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { compiler: XCode, CC: cc, CXX: c++ }
        otp: [27, 28, 29]
    steps:
      - uses: actions/checkout@v2
      - name: Install Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3'
      - name: OTP Version
        run:  erl -eval '{ok, Version} = file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])), io:format("Version=~s\n", [Version]), halt().' -noshell -noinput;
      - name: Fix Ownership
        run:  git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: Install CMake
        run:  brew install cmake
      - name: Build
        env:
          CC:  ${{ matrix.compiler.CC }}
          CXX: ${{ matrix.compiler.CXX }}
        run:  make compile
      - name: Test
        env:
          CC:  ${{ matrix.compiler.CC }}
          CXX: ${{ matrix.compiler.CXX }}
        run:  make test

  create-tag:
    name: Create Tag if Version Changed
    runs-on: ubuntu-latest
    needs: [linux, macOS]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Don't let checkout persist its own GITHUB_TOKEN credential helper —
          # it conflicts with (and wins over) the RELEASE_PAT we embed in the
          # push URL below, causing the push to authenticate as
          # github-actions[bot] (which lacks permission) instead of RELEASE_PAT.
          persist-credentials: false

      - name: Get project version
        id: project_version
        run: |
          VERSION=$(sed -nE 's/.*\{vsn,\s*"([^"]+)".*/\1/p' src/glazejson.app.src | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Project version: $VERSION"

      - name: Check if tag should be created
        id: should_create_tag
        run: |
          PROJECT_VERSION="${{ steps.project_version.outputs.version }}"
          MAX_TAG=$(git tag -l "*.*.*" | sed 's/^v//' | sort -V | tail -1)

          if [ -z "$MAX_TAG" ]; then
            echo "create_tag=true"   >> $GITHUB_OUTPUT
            echo "First tag: $PROJECT_VERSION"
          elif [ "$(printf '%s\n' "$MAX_TAG" "$PROJECT_VERSION" | sort -V | tail -1)" = "$PROJECT_VERSION" ] && [ "$MAX_TAG" != "$PROJECT_VERSION" ]; then
            echo "create_tag=true"   >> $GITHUB_OUTPUT
            echo "Project version $PROJECT_VERSION is greater than max tag $MAX_TAG, creating tag"
          elif [ "$MAX_TAG" = "$PROJECT_VERSION" ]; then
            # Same version as the latest tag: if that tag's commit was created less
            # than an hour ago, assume this is a quick follow-up fix and re-tag/re-release
            # rather than silently skipping.
            TAG_COMMIT_TIME=$(git log -1 --format=%ct "$PROJECT_VERSION")
            NOW=$(date +%s)
            AGE=$((NOW - TAG_COMMIT_TIME))

            if [ "$AGE" -lt 3600 ]; then
              echo "create_tag=recreate" >> $GITHUB_OUTPUT
              echo "Tag $PROJECT_VERSION's commit is ${AGE}s old (< 1h), recreating tag at current commit"
            else
              echo "create_tag=false"   >> $GITHUB_OUTPUT
              echo "Tag $PROJECT_VERSION already exists and its commit is ${AGE}s old (>= 1h), skipping"
            fi
          else
            echo "create_tag=false"   >> $GITHUB_OUTPUT
            echo "Project version $PROJECT_VERSION is not greater than max tag $MAX_TAG, skipping tag creation"
          fi

      - name: Create and push tag
        if: steps.should_create_tag.outputs.create_tag != 'false'
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          VERSION="${{ steps.project_version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          REMOTE="https://x-access-token:${RELEASE_PAT}@github.com/${{ github.repository }}.git"

          git tag -f "$VERSION"

          if [ "${{ steps.should_create_tag.outputs.create_tag }}" = "recreate" ]; then
            echo "Force-pushing tag $VERSION to point at current commit"
            git push --force "$REMOTE" "$VERSION"
            echo "### :recycle: Recreated tag \`$VERSION\` at \`$(git rev-parse --short HEAD)\`" >> $GITHUB_STEP_SUMMARY
          else
            git push "$REMOTE" "$VERSION"
            echo "### :label: Created tag \`$VERSION\` at \`$(git rev-parse --short HEAD)\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Trigger release workflow
        if: steps.should_create_tag.outputs.create_tag != 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_PAT }}
          script: |
            // Explicitly trigger the release workflow via the GitHub API.
            // GitHub Actions has a limitation: workflows triggered by other workflows don't
            // automatically trigger additional workflows, even with a PAT. The release.yaml
            // workflow has workflow_dispatch enabled to allow manual triggering via the API.
            const version = "${{ steps.project_version.outputs.version }}";
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yaml',
              ref: version,
              inputs: {}
            });
