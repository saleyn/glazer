name: Release

on:
  schedule:
    # Check hourly whether the latest non-retired version published to
    # Hex.pm has a corresponding git tag yet, and create one if its
    # version-bump commit is at least 6 hours old. The age check gives
    # room for amended re-publishes of the same version on Hex.pm before
    # it gets tagged.
    - cron: "0 * * * *"

jobs:
  detect:
    name: Detect Release
    runs-on: ubuntu-latest
    outputs:
      should_tag: ${{ steps.resolve.outputs.should_tag }}
      version:    ${{ steps.resolve.outputs.version }}
      commit:     ${{ steps.resolve.outputs.commit }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          # Latest that excludes pre-releases
          otp-version: "> 0"
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Resolve release version
        id: resolve
        run: |
          get_version() { sed -nE 's/.*\{vsn,\s*"([^"]+)".*/\1/p' "$1" | head -1; }

          # Check whether the latest version published to Hex.pm already has
          # a matching git tag; if not, create one.
          APP="glazer"
          INFO=$(mix hex.info "$APP" 2>/dev/null)
          VSNS=$(printf '%s\n' "$INFO" | awk '
            /^Releases:/ { sub(/^Releases:[[:space:]]*/, ""); print; exit }
            /^Recent releases:/ { recent=1; next }
            recent && /^[[:space:]]*[0-9]/ { sub(/^[[:space:]]*/, ""); print; next }
            recent && !/^[[:space:]]/ { exit }
          ')
          # Skip retired/deprecated releases — pick the latest non-retired one.
          PUBLISHED=$(printf '%s\n' "$VSNS" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$' | grep -v '(retired)' | awk 'NR==1 {print $1}')

          if [ -z "$PUBLISHED" ]; then
            echo "Could not determine latest published (non-retired) version, skipping"
            echo "should_tag=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git tag -l "$PUBLISHED" | grep -q .; then
            echo "Tag $PUBLISHED already exists, skipping"
            echo "should_tag=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Find the commit that introduced this version in glazer.app.src.
          COMMIT=""
          for sha in $(git log --format=%H -- src/glazer.app.src); do
            VER=$(git show "$sha:src/glazer.app.src" | get_version /dev/stdin)
            if [ "$VER" = "$PUBLISHED" ]; then
              COMMIT="$sha"
            else
              break
            fi
          done

          if [ -z "$COMMIT" ]; then
            echo "No commit on main introduces version $PUBLISHED, skipping"
            echo "should_tag=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Only tag once the version-bump commit is at least 6 hours old, to
          # allow several amended Hex.pm releases of the same version before
          # it gets tagged.
          COMMIT_TS=$(git show -s --format=%ct "$COMMIT")
          NOW_TS=$(date +%s)
          AGE=$((NOW_TS - COMMIT_TS))
          MIN_AGE=$((6 * 3600))

          if [ "$AGE" -lt "$MIN_AGE" ]; then
            echo "Commit $COMMIT for version $PUBLISHED is only $((AGE / 60)) minutes old, waiting for $((MIN_AGE / 3600)) hours"
            echo "should_tag=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Hex.pm has unreleased tag for version $PUBLISHED (commit $COMMIT)"
          echo "version=$PUBLISHED" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT"     >> $GITHUB_OUTPUT
          echo "should_tag=true"    >> $GITHUB_OUTPUT

  create-tag:
    name: Create Tag
    runs-on: ubuntu-latest
    needs: [detect]
    if: needs.detect.outputs.should_tag == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Don't let checkout persist its own GITHUB_TOKEN credential helper —
          # it conflicts with (and wins over) the RELEASE_PAT we embed in the
          # push URL below, causing the push to authenticate as
          # github-actions[bot] (which lacks permission) instead of RELEASE_PAT.
          persist-credentials: false

      - name: Create and push tag
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          VERSION="${{ needs.detect.outputs.version }}"
          COMMIT="${{ needs.detect.outputs.commit }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          REMOTE="https://x-access-token:${RELEASE_PAT}@github.com/${{ github.repository }}.git"

          git tag "$VERSION" "$COMMIT"
          git push "$REMOTE" "$VERSION"
          echo "### :label: Created tag \`$VERSION\` at \`$(git rev-parse --short "$COMMIT")\`" >> $GITHUB_STEP_SUMMARY
