name: Tag and Release

on:
  workflow_run:
    workflows: ["build"]
    types: [completed]
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

env:
  # Number of most-recent Hex.pm releases to keep active (not retire).
  KEEP_RELEASES: 5

jobs:
  detect:
    name: Detect latest hex.pm release
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      github.event_name == 'workflow_dispatch'
    outputs:
      should_tag: ${{ steps.resolve.outputs.should_tag }}
      version:    ${{ steps.resolve.outputs.version }}
      commit:     ${{ steps.resolve.outputs.commit }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release version
        id: resolve
        run: |
          # Read current version from glazer.app.src in HEAD
          VERSION=$(sed -nE 's/.*\{vsn,\s*"([^"]+)".*/\1/p' src/glazer.app.src | head -n1)

          if [ -z "$VERSION" ]; then
            echo "Could not read version from src/glazer.app.src, skipping"
            echo "should_tag=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if this version is already tagged
          if git tag -l "$VERSION" | grep -q .; then
            echo "Tag $VERSION already exists, skipping"
            echo "should_tag=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get the HEAD commit
          COMMIT=$(git rev-parse HEAD)

          echo "Found untagged version $VERSION at commit \`${COMMIT:0:7}\`"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT"     >> $GITHUB_OUTPUT
          echo "should_tag=true"    >> $GITHUB_OUTPUT

  create-tag:
    name: Create Tag
    runs-on: ubuntu-latest
    needs: [detect]
    if: needs.detect.outputs.should_tag == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Don't let checkout persist its own GITHUB_TOKEN credential helper —
          # it conflicts with (and wins over) the RELEASE_PAT we embed in the
          # push URL below, causing the push to authenticate as
          # github-actions[bot] (which lacks permission) instead of RELEASE_PAT.
          persist-credentials: false

      - name: Create and push tag ${{ needs.detect.outputs.version }}
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          VERSION="${{ needs.detect.outputs.version }}"
          COMMIT="${{ needs.detect.outputs.commit }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          REMOTE="https://x-access-token:${RELEASE_PAT}@github.com/${{ github.repository }}.git"

          git tag "$VERSION" "$COMMIT"
          git push "$REMOTE" "$VERSION"

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [detect, create-tag]
    permissions:
      contents: write

    steps:
      - name: Get optional changelog entry
        id: changelog
        run: |
          # Extract changelog for this version
          VERSION="${{ needs.detect.outputs.version }}"
          # Look for the version in CHANGELOG.md or fall back to generated notes
          if [ -f "CHANGELOG.md" ]; then
            # Extract section between version header and next version header
            awk "/^## ${VERSION#v}/{flag=1;next}/^## v[0-9]/{flag=0}flag" CHANGELOG.md > changelog.txt
            if [ -s changelog.txt ]; then
              echo "has_changelog=true" >> $GITHUB_OUTPUT
            else
              echo "has_changelog=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_changelog=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Github Release ${{ needs.detect.outputs.version }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.detect.outputs.version }}
          body_path: ${{ steps.changelog.outputs.has_changelog == 'true' && 'changelog.txt' || '' }}
          generate_release_notes: ${{ steps.changelog.outputs.has_changelog != 'true' }}
          draft: false
          prerelease: ${{ contains(needs.detect.outputs.version, 'alpha') || contains(needs.detect.outputs.version, 'beta') || contains(needs.detect.outputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Summary for Release ${{ needs.detect.outputs.version }}
        run: |
          VERSION="${{ needs.detect.outputs.version }}"
          COMMIT="${{ needs.detect.outputs.commit }}"
          echo "### :label: Created a tagged release \`$VERSION\` at \`${COMMIT:0:7}\`" >> $GITHUB_STEP_SUMMARY

  publish-to-hex:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest
    needs: [detect, create-github-release]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rebar3
        uses: erlef/setup-beam@v1
        with:
          # Latest that excludes pre-releases
          otp-version:    "> 0"
          elixir-version: "> 0"
          rebar3-version: latest
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Publish to Hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          VERSION="${{ needs.detect.outputs.version }}"
          APP="glazer"
          echo "Publishing $APP $VERSION"
          rebar3 hex publish --repo hexpm --yes

      - name: Retire prior versions
        run: |
          set +e
          APP=$(sed -nE '/\{application/{s/.*\{application,\s*([a-z_]+)\s*,.*/\1/p; q}' src/glazer.app.src)

          # Releases are returned newest-first.
          VSNS=$(curl -fsS "https://hex.pm/api/packages/$APP" | jq -r '.releases[].version')

          if [ -z "$VSNS" ]; then
            echo "$APP: no releases were found on Hex"
            exit 0
          fi

          echo "Releases (newest first):"
          printf '%s\n' "$VSNS"

          # Keep the KEEP_RELEASES most recent versions untouched; only
          # consider retiring anything older than that.
          KEEP=$(printf '%s\n' "$VSNS" | head -n "$KEEP_RELEASES")
          CANDIDATES=$(printf '%s\n' "$VSNS" | tail -n +"$((KEEP_RELEASES + 1))")

          if [ -z "$CANDIDATES" ]; then
            echo "$APP: $KEEP_RELEASES or fewer releases, nothing to retire"
            exit 0
          fi

          echo "Keeping latest versions:"
          printf '%s\n' "$KEEP"

          for VSN in $CANDIDATES; do
            RETIREMENT=$(curl -fsS "https://hex.pm/api/packages/$APP/releases/$VSN" | jq -r '.retirement')
            if [ "$RETIREMENT" = "null" ]; then
              echo "Retiring version $VSN of $APP on Hex..."
              mix hex.retire $APP $VSN deprecated --message "Deprecated"
            else
              echo "$APP $VSN is already retired, skipping"
            fi
          done
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
